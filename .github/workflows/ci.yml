name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: docker build -t playlist-avatar:ci .
      - id: start-container
        run: docker run -d --name playlist-avatar-ci --init --memory 256m --memory-swap 256m --cpus 1 --pids-limit 64 --read-only --tmpfs /tmp:size=16m --cap-drop ALL --security-opt no-new-privileges:true -e PUBLIC_ORIGIN=http://127.0.0.1:18080 -p 127.0.0.1:18080:8080 playlist-avatar:ci
      - run: node scripts/smoke.mjs http://127.0.0.1:18080
      - if: always() && steps.start-container.outcome == 'success'
        run: docker rm --force playlist-avatar-ci
