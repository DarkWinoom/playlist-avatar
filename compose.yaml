services:
  playlist-avatar:
    image: "${PLAYLIST_AVATAR_IMAGE:-playlist-avatar:0.1.0-local}"
    build: .
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://127.0.0.1:8080}"
      LASTFM_API_KEY: "${LASTFM_API_KEY:-}"
      ALLOWED_SERVICES: "${ALLOWED_SERVICES:-[]}"
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped
    stop_grace_period: 15s
